server:
  port: ${PORT}
  external-port: ${EXTERNAL_PORT}
  protocol: ${PROTOCOL}
  domain: ${DOMAIN}

spring:
  application:
    name: word-online-server
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PW}

logging:
  discord-webhook-url: ${DISCORD_WEBHOOK_URL}
  level:
    org.springframework.web.socket: WARN
    org.springframework.messaging: WARN
#    com.wordonline.server.game.domain.bot: DEBUG
#    com.wordonline.server.game.service.system: DEBUG

team6515:
  server:
    account:
      url: ${ACCOUNT_SERVER_URL}

wordonline:
  bot:
    auto-match:
      enabled: ${AUTO_BOT_MATCH_ENABLED:true}
      initial-delay-ms: ${AUTO_BOT_MATCH_INITIAL_DELAY_MS:10000}
      fixed-delay-ms: ${AUTO_BOT_MATCH_FIXED_DELAY_MS:5000}

jwt:
  public:
    key: ${JWT_PUBLIC_KEY}
