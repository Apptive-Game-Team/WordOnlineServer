server:
  port: ${PORT:7777}
  external-port: ${EXTERNAL_PORT}
  protocol: ${PROTOCOL}
  domain: ${DOMAIN}

# Metrics run on their own port so the public app port never serves /actuator.
# Health and Prometheus endpoints allow unauthenticated scrapes.
# MANAGEMENT_PORT must stay reachable only from the Prometheus host.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: word-online-server
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PW}

logging:
  discord-webhook-url: ${DISCORD_WEBHOOK_URL}
  level:
    org.springframework.web.socket: WARN
    org.springframework.messaging: WARN
#    com.wordonline.server.game.domain.bot: DEBUG
#    com.wordonline.server.game.service.system: DEBUG

team6515:
  server:
    account:
      url: ${ACCOUNT_SERVER_URL}

jwt:
  public:
    key: ${JWT_PUBLIC_KEY}
