server:
  port: ${PORT:7777}
  external-port: ${EXTERNAL_PORT}
  protocol: ${PROTOCOL}
  domain: ${DOMAIN}
  heartbeat-interval-ms: ${HEARTBEAT_INTERVAL_MS:10000}
  max-sessions: ${MAX_SESSIONS:100}

# Metrics run on their own port so the public app port never serves /actuator.
# Health and Prometheus endpoints allow unauthenticated scrapes.
# MANAGEMENT_PORT must stay reachable only from the Prometheus host.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: word-online-server
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PW}

logging:
  discord-webhook-url: ${DISCORD_WEBHOOK_URL}
  level:
    org.springframework.web.socket: WARN
    org.springframework.messaging: WARN
#    com.wordonline.server.game.domain.bot: DEBUG
#    com.wordonline.server.game.service.system: DEBUG

# Self-play bot games. target-games is the number of sessions the scheduler keeps running;
# every check interval it tops the server back up to that number. The default of 1 reproduces
# the original "one bot game while idle" behaviour. Raise both knobs to generate a synthetic
# load for profiling, e.g. BOT_AUTO_MATCH_TARGET_GAMES=50 BOT_AUTO_MATCH_CHECK_INTERVAL_MS=5000.
bot:
  auto-match:
    enabled: ${BOT_AUTO_MATCH_ENABLED:true}
    target-games: ${BOT_AUTO_MATCH_TARGET_GAMES:1}
    check-interval-ms: ${BOT_AUTO_MATCH_CHECK_INTERVAL_MS:60000}

team6515:
  server:
    account:
      url: ${ACCOUNT_SERVER_URL}

# Outbound calls to the lobby. Without LOBBY_BASE_URL the session-ended notification is
# skipped and the lobby falls back to its reconciler. The service token is issued elsewhere
# and mounted as a file; never commit its value.
lobby:
  base-url: ${LOBBY_BASE_URL:}
  service-token-path: ${JWT_FILE_PATH:}
  request-timeout: ${LOBBY_REQUEST_TIMEOUT_MS:1000}
  max-attempts: ${LOBBY_MAX_ATTEMPTS:2}

jwt:
  public:
    key: ${JWT_PUBLIC_KEY}
