server:
  port: ${PORT}
  external-port: ${EXTERNAL_PORT}
  protocol: ${PROTOCOL}
  domain: ${DOMAIN}

spring:
  application:
    name: word-online-server
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PW}

logging:
  discord-webhook-url: ${DISCORD_WEBHOOK_URL}
  level:
    org.springframework.web.socket: WARN
    org.springframework.messaging: WARN
#    com.wordonline.server.game.domain.bot: DEBUG
#    com.wordonline.server.game.service.system: DEBUG

team6515:
  server:
    account:
      url: ${ACCOUNT_SERVER_URL}

jwt:
  public:
    key: ${JWT_PUBLIC_KEY}

game:
  lockstep:
    protocol-version: ${LOCKSTEP_PROTOCOL_VERSION:1}
    simulation-version: ${LOCKSTEP_SIMULATION_VERSION:}
    config-version: ${LOCKSTEP_CONFIG_VERSION:}
    ready-timeout-ms: ${LOCKSTEP_READY_TIMEOUT_MS:10000}
    frame-timeout-ms: ${LOCKSTEP_FRAME_TIMEOUT_MS:1000}
    maximum-future-frames: ${LOCKSTEP_MAXIMUM_FUTURE_FRAMES:2}
